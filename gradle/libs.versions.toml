# Central version catalog - the single source of truth for every external
# dependency and plugin version in this repository. Security floors for
# vulnerable transitive dependencies are applied as Gradle constraints in
# pahebatcher/build.gradle.kts, read from the pin versions below
# (DECISIONS.md 167).

[versions]
# Build plugins / toolchain (see DECISIONS.md Decision 17 for the verified baseline)
agp = "9.5.3"
kotlin = "2.4.21"
ksp = "2.3.14"
composeBom = "2026.11.01"

# AndroidX core
activityCompose = "1.13.0"
coreKtx = "1.19.1"

# Lifecycle - one release line shared by runtime-ktx, viewmodel-compose and runtime-compose
lifecycle = "2.11.1"

# Database and persistence
room = "2.8.5"
datastore = "1.3.0"

# Coroutines and serialization
coroutines = "1.11.0"
serialization = "1.13.0"

# Networking
okhttp = "4.12.1"

# Media
ffmpegkit = "8.1.9"
smartexception = "0.2.1"
media3 = "1.11.1"

# Background processing
workmanager = "2.12.0"

# Navigation
navigationCompose = "2.10.2"

# Testing
junit = "4.13.2"
testCore = "1.7.0"
testRunner = "1.7.0"
testExtJunit = "1.3.0"

# Security floors for vulnerable TRANSITIVE dependencies, applied as Gradle
# dependency constraints in pahebatcher/build.gradle.kts (buildscript
# classpath, androidLintTool, KSP processor paths and the app graphs).
# The introducing dependencies are pinned by Google (AGP/lint toolchain) or are
# runtime libraries we do not own (Media3's guava-android), so each value is the
# patched release required by the advisory noted beside it.
bouncycastle = "1.86" # bcprov/bcpkix/bcutil family, kept aligned: CVE-2026-8763, CVE-2026-13506, CVE-2026-5588 and every other advisory affecting 1.80.2
jdom2 = "2.0.6.1" # CVE-2021-33813 (XXE)
jose4j = "0.9.6" # CVE-2024-29371 (compressed JWE DoS)
guava = "33.7.2" # CVE-2026-102554; each graph's constraint appends its flavor (-jre tooling / -android app) to this base
commonsLang3 = "3.18.0" # CVE-2025-48924 (uncontrolled recursion)
httpclient = "4.5.14" # CVE-2020-13956 (fixed in 4.5.13; 4.5.14 is also what AGP itself already requires)
asm = "9.11.1" # org.ow2.asm family: SNYK-JAVA-ORGOW2ASM-21715439/442/445/448/452

[libraries]
# AndroidX / Compose - compose artifacts are version-managed by the Compose BOM
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
androidx-compose-ui = { group = "androidx.compose.ui", name = "ui" }
androidx-compose-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
androidx-compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
androidx-compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
androidx-compose-ui-test-manifest = { group = "androidx.compose.ui", name = "ui-test-manifest" }
androidx-compose-ui-test-junit4 = { group = "androidx.compose.ui", name = "ui-test-junit4" }
androidx-compose-material3 = { group = "androidx.compose.material3", name = "material3" }
# Only the core icon set (Home/Settings/Search/Close/Refresh/PlayArrow/ArrowBack);
# version pinned by the Compose BOM, never material-icons-extended.
androidx-compose-material-icons-core = { group = "androidx.compose.material", name = "material-icons-core" }

# Lifecycle - all on the single lifecycle release line
androidx-lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycle" }
androidx-lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycle" }
androidx-lifecycle-runtime-compose = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "lifecycle" }

# Database and persistence
androidx-room-runtime = { group = "androidx.room", name = "room-runtime", version.ref = "room" }
androidx-room-ktx = { group = "androidx.room", name = "room-ktx", version.ref = "room" }
androidx-room-compiler = { group = "androidx.room", name = "room-compiler", version.ref = "room" }
androidx-room-testing = { group = "androidx.room", name = "room-testing", version.ref = "room" }
androidx-datastore-preferences = { group = "androidx.datastore", name = "datastore-preferences", version.ref = "datastore" }

# Coroutines
kotlinx-coroutines-core = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-core", version.ref = "coroutines" }
kotlinx-coroutines-android = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "coroutines" }
kotlinx-coroutines-test = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-test", version.ref = "coroutines" }

# Serialization
kotlinx-serialization-json = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-json", version.ref = "serialization" }

# Networking (Phase 5 validation)
okhttp = { group = "com.squareup.okhttp3", name = "okhttp", version.ref = "okhttp" }

# Media - FFmpegKit (Phase 9, MP4 assembly candidate)
ffmpegkit-full = { group = "dev.ffmpegkit-maintained", name = "ffmpeg-kit-full", version.ref = "ffmpegkit" }
smartexception-java = { group = "com.arthenica", name = "smart-exception-java", version.ref = "smartexception" }

# Media3 - player and direct HLS streaming (single media3 release line)
androidx-media3-exoplayer = { group = "androidx.media3", name = "media3-exoplayer", version.ref = "media3" }
androidx-media3-exoplayer-hls = { group = "androidx.media3", name = "media3-exoplayer-hls", version.ref = "media3" }
androidx-media3-datasource-okhttp = { group = "androidx.media3", name = "media3-datasource-okhttp", version.ref = "media3" }
androidx-media3-session = { group = "androidx.media3", name = "media3-session", version.ref = "media3" }
androidx-media3-ui-compose-material3 = { group = "androidx.media3", name = "media3-ui-compose-material3", version.ref = "media3" }

# Background processing (Phase 10 - downloads)
androidx-work-runtime = { group = "androidx.work", name = "work-runtime", version.ref = "workmanager" }
androidx-work-testing = { group = "androidx.work", name = "work-testing", version.ref = "workmanager" }

# Navigation (Phase 11 - single-activity NavHost)
androidx-navigation-compose = { group = "androidx.navigation", name = "navigation-compose", version.ref = "navigationCompose" }

# Testing
junit = { group = "junit", name = "junit", version.ref = "junit" }
androidx-test-core = { group = "androidx.test", name = "core-ktx", version.ref = "testCore" }
androidx-test-runner = { group = "androidx.test", name = "runner", version.ref = "testRunner" }
androidx-test-ext-junit = { group = "androidx.test.ext", name = "junit", version.ref = "testExtJunit" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
compose-compiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
