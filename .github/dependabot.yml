# Dependabot configuration for PaheBatcher-Droid.
#
# Rationale (see DECISIONS.md 167 and LIMITATIONS.md 54.7):
#   * Weekly cadence with grouped PRs keeps review load low while still
#     clearing advisories promptly (security groups are NOT subject to the
#     default 3-day version-update cooldown).
#   * The `gradle` ecosystem reads the manifests this repository actually
#     declares versions in: settings.gradle.kts, gradle/libs.versions.toml
#     and pahebatcher/build.gradle.kts. Version updates for DIRECTLY declared
#     dependencies (catalog entries, plugins) are expected from these files;
#     the generated lockfiles (pahebatcher/gradle.lockfile,
#     pahebatcher/buildscript-gradle.lockfile) are parsed by the updater
#     (dependabot-core#16669) but do NOT by themselves enable updates.
#   * Security updates for the pinned TRANSITIVE dependencies (guava, bcprov/
#     bcpkix, jdom2, jose4j, commons-lang3, httpclient) are NOT claimed to be
#     automated: GitHub documents that security updates are triggered only
#     for dependencies specified in a manifest or lock file, and that for
#     ecosystems other than npm/NuGet Dependabot cannot update a transitive
#     dependency when doing so would also require updating the parent
#     dependency. Those seven exist only as AGP/lint/KSP/Media3 transitives,
#     and no successful GitHub-hosted security-update run has been observed
#     for them (LIMITATIONS.md 54.7). Their remediation is the Gradle
#     minimum-version pins in gradle/libs.versions.toml plus the manual
#     process documented there.
#   * The `github-actions` ecosystem keeps the SHA-pinned workflow actions in
#     .github/workflows/ current (each pin carries a trailing version comment
#     that Dependabot maintains).
#   * Majors are deliberately left ungrouped: a single mixed-major PR is too
#     risky to review for a release-signed Android build. Minors/patches and
#     security updates are grouped.
#
# Known integration gaps (documented in LIMITATIONS.md):
#   * dependabot-core does not yet update gradle/verification-metadata.xml
#     checksums (dependabot-core#1996). After merging any Dependabot Gradle PR,
#     regenerate locks + checksums locally with the documented command:
#       ./gradlew --write-verification-metadata sha256 --write-locks `
#         :pahebatcher:dependencies :pahebatcher:buildEnvironment `
#         :pahebatcher:assembleDebug :pahebatcher:assembleRelease `
#         :pahebatcher:bundleRelease :pahebatcher:testDebugUnitTest `
#         :pahebatcher:testReleaseUnitTest :pahebatcher:lintDebug `
#         :pahebatcher:assembleDebugAndroidTest
#     and commit the refreshed lockfiles + verification-metadata.xml.

version: 2
updates:
  - package-ecosystem: "gradle"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Asia/Kolkata"
    open-pull-requests-limit: 10
    rebase-strategy: auto
    commit-message:
      prefix: "deps"
      include: "scope"
    groups:
      # IF GitHub opens security-update PRs for advisories, group them so a
      # multi-CVE batch lands as ONE PR instead of several separate jobs.
      # Whether security-update PRs are opened at all for the pinned Gradle
      # transitives is NOT established - see LIMITATIONS.md 54.7.
      gradle-security-updates:
        applies-to: security-updates
        patterns:
          - "*"
      # Routine non-major maintenance in a single weekly PR.
      gradle-minor-and-patch:
        applies-to: version-updates
        update-types:
          - "minor"
          - "patch"
        patterns:
          - "*"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Asia/Kolkata"
    open-pull-requests-limit: 5
    rebase-strategy: auto
    commit-message:
      prefix: "ci"
      include: "scope"
    groups:
      github-actions:
        patterns:
          - "*"
