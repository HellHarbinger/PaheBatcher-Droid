org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=true
android.nonTransitiveRClass=true
# Machine-specific paths (Android SDK, JDK) live in local.properties (gitignored)
# and in the JAVA_HOME environment variable - never committed here.

# AGP 9 creates unit-test components only for the tested (debug) build type
# (android.onlyEnableUnitTestForTheTestedBuildType defaults to true there).
# SPEC 33 - "have debug logging disabled/restricted in release" - is verified
# against the RELEASE-compiled AppLog (AppLogReleaseVariantTest, run by
# testReleaseUnitTest), so release-variant unit tests are opted back in here.
# Nothing else changes: signing, minification, packaging, lint and the debug
# unit tests are untouched.
android.onlyEnableUnitTestForTheTestedBuildType=false
